<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MIS COMIDAS FAVORITAS</title>

    <style>
        body {
            background-color: #fff0f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #704080;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #f5e6f7;
        }

        main {
            width: 90%;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            text-align: center;
            color: #704080;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        figure {
            width: 250px;
            margin: 0;
            padding: 15px;
            background-color: #f5e6f7;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 8px #d2bfd8;
        }

        figure img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        figcaption {
            margin-top: 10px;
            font-weight: bold;
            color: #704080;
        }

        footer {
            background-color: #704080;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>

        <h1>MIS COMIDAS FAVORITAS</h1>

        <nav>
            <a href="index.html">SOBRE MI</a>
            <a href="comidas.html">MIS COMIDAS FAVORITAS</a>
            <a href="actividades.html">MIS HOBBIES</a>
        </nav>

    </header>

    <main>

        <h2>Comidas que me gustan</h2>

        <p style="text-align: center;">
            Estas son algunas de mis comidas favoritas.
        </p>

        <section class="galeria">

            <figure>
                <img src="images/comida1.png" alt="Comida favorita 1">
                <figcaption>Comida favorita 1</figcaption>
            </figure>

            <figure>
                <img src="images/comida2.jpg" alt="Comida favorita 2">
                <figcaption>Comida favorita 2</figcaption>
            </figure>

            <figure>
                <img src="images/comida3.jfif" alt="Comida favorita 3">
                <figcaption>Comida favorita 3</figcaption>
            </figure>

            <figure>
                <img src="images/comida4.jfif" alt="Comida favorita 4">
                <figcaption>Comida favorita 4</figcaption>
            </figure>
           

        </section>

    </main>

    <footer>
        <p>Esta página fue creada por mí, jeje.</p>
    </footer>

</body>

</html>
